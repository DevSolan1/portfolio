<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Solan Abate</title>
  <script>
    // Repository base path on GitHub Pages.
    // Project site (username.github.io/repo-name): use "/repo-name/".
    // User site named username.github.io: use "/".
    var BASE = "/portfolio/"; // change "portfolio" to your actual repo name
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t === "dark") document.documentElement.classList.add("dark");
    })();
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#f7f7fb;--text:#14141f;--muted:#5b5b70;--accent:#f97316;--line:#e3e3ee}
    html.dark{--bg:#0b0b14;--text:#ececf5;--muted:#9a9ab3;--accent:#fb8a3c;--line:#24243a}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:1rem}
    h1{font-weight:800;font-size:4rem;margin:0}
    p{color:var(--muted)}
    a{display:inline-block;margin-top:1rem;padding:.65rem 1.2rem;border-radius:.7rem;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Page not found. The page you are looking for does not exist or has moved.</p>
    <a id="home-link" href="/">Go home</a>
  </main>
  <script>
    var link = document.getElementById("home-link");
    if (link) link.setAttribute("href", BASE);
    var icon = document.querySelector('link[rel="icon"]');
    if (icon) icon.setAttribute("href", BASE + "assets/img/favicon.svg");
  </script>
</body>
</html>
